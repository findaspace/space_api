name: space

services:
  postgres:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_USER: space
      POSTGRES_PASSWORD: space
      POSTGRES_DB: space
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U space -d space"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    image: quay.io/minio/minio@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: spaceminio
      MINIO_ROOT_PASSWORD: spaceminio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10



   
   
  osrm-build:
    build:
      context: .
      dockerfile: Dockerfile.osrm
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ ! -f /data/ghana-latest.osrm.mldgr ]; then
          wget -O /data/ghana-latest.osm.pbf https://download.geofabrik.de/africa/ghana-latest.osm.pbf &&
          osrm-extract -p /opt/foot.lua /data/ghana-latest.osm.pbf &&
          osrm-partition /data/ghana-latest.osrm &&
          osrm-customize /data/ghana-latest.osrm
        fi
    volumes:
      - osrmdata:/data

  osrm:
    build:
      context: .
      dockerfile: Dockerfile.osrm
    command:
      - osrm-routed
      - --algorithm=MLD
      - --max-table-size=100
      - /data/ghana-latest.osrm
    depends_on:
      osrm-build:
        condition: service_completed_successfully
    ports:
      - "5000:5000"
    volumes:
      - osrmdata:/data



        

