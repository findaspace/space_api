name: space
services:
  api:
    image: ghcr.io/samnart1/space_api:${TAG:-latest}
    restart: unless-stopped
    env_file: [.env.production]
    ports: ["127.0.0.1:8080:8080"]
    healthcheck:
      test: ["CMD", "/api", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
  worker:
    image: ghcr.io/samnart1/space_api-worker:${TAG:-latest}
    restart: unless-stopped
    env_file: [.env.production]
