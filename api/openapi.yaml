openapi: 3.1.0
info:
  title: Space API
  version: 1.0.0
  description: |
    Money is always an integer in the currency's minor unit (pesewas for GHS).
    Dates in a booking context are calendar dates, not instants.
    Every error is an RFC 9457 problem document.

# The server is the host root. Paths carry their own /v1 prefix, because the
# health probes live outside it and a spec with /v1 as the base could not
# describe them.
servers:
  - url: http://localhost:8080
  - url: https://api.findaspace.gh

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Problem:
      type: object
      required: [title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        trace_id:
          type: string
          description: Matches request_id in the server logs.
        errors:
          type: array
          items: { $ref: "#/components/schemas/FieldError" }

    FieldError:
      type: object
      required: [field, code]
      properties:
        field: { type: string }
        code: { type: string }
        detail: { type: string }

    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
        version: { type: string }

    Readiness:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        checks:
          type: object
          additionalProperties: { type: string }

  responses:
    Problem:
      description: RFC 9457 problem document
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

paths:
  /healthz:
    get:
      summary: Liveness
      description: The process is running. Says nothing about its dependencies.
      operationId: getHealth
      responses:
        "200":
          description: Alive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /readyz:
    get:
      summary: Readiness
      description: The process can serve traffic, including reaching its database.
      operationId: getReadiness
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
        "503":
          description: Not ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
