openapi: 3.1.0
info:
  title: Space API
  version: 1.0.0
  description: 'Money is always an integer in the currency''s minor unit (pesewas
    for GHS).

    Dates in a booking context are calendar dates, not instants.

    Every error is an RFC 9457 problem document.

    '
servers:
- url: http://localhost:8080
- url: https://api.findaspace.gh
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Problem:
      type: object
      required:
      - title
      - status
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        trace_id:
          type: string
          description: Matches request_id in the server logs.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      required:
      - field
      - code
      properties:
        field:
          type: string
        code:
          type: string
        detail:
          type: string
    Health:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - ok
        version:
          type: string
    Readiness:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - ok
          - unavailable
        checks:
          type: object
          additionalProperties:
            type: string
    ExternalLogin:
      type: object
      additionalProperties: false
      required:
      - provider
      - id_token
      - nonce
      properties:
        provider:
          type: string
          enum:
          - google
          - microsoft
          - apple
        id_token:
          type: string
          maxLength: 16384
        nonce:
          type: string
          minLength: 32
          maxLength: 128
    User:
      type: object
      required:
      - id
      - phone
      - display_name
      - roles
      - created_at
      properties:
        id:
          type: string
          format: uuid
        phone:
          type: string
          description: Verified E.164 contact number, or an empty string when no phone
            is connected.
        phone_verified:
          type: boolean
        display_name:
          type: string
        roles:
          type: array
          items:
            type: string
            enum:
            - guest
            - host
            - admin
            - support
        created_at:
          type: string
          format: date-time
    TokenResponse:
      type: object
      required:
      - user
      - access_token
      - token_type
      - expires_at
      - refresh_token
      - refresh_expires_at
      properties:
        user:
          $ref: '#/components/schemas/User'
        access_token:
          type: string
        token_type:
          type: string
          enum:
          - Bearer
        expires_at:
          type: string
          format: date-time
        refresh_token:
          type: string
        refresh_expires_at:
          type: string
          format: date-time
    OTPSent:
      type: object
      required:
      - phone
      - expires_at
      properties:
        phone:
          type: string
          description: Masked. The full number is never echoed back.
        expires_at:
          type: string
          format: date-time
    RefreshRequest:
      type: object
      additionalProperties: false
      required:
      - refresh_token
      properties:
        refresh_token:
          type: string
    SearchResult:
      type: object
      required:
      - slug
      - title
      - space_type
      - rental_mode
      - price_minor
      - currency
      - price_period
      - locality
      - latitude
      - longitude
      - photo_count
      - review_count
      properties:
        slug:
          type: string
        title:
          type: string
        space_type:
          type: string
          enum:
          - room
          - self_contained
          - chamber_and_hall
          - apartment
          - house
          - boys_quarters
          - hostel_bed
          - shop
          - office
          - warehouse
          - event_space
          - land
          - parking
          - studio
          - football_pitch
          - sports_court
          - sports_facility
        rental_mode:
          type: string
          enum: &id001
          - nightly
          - term
          - flexible
        price_minor:
          type: integer
          format: int64
          description: Minor units. 130000 is GHS 1,300.
        currency:
          type: string
        price_period:
          type: string
          enum: &id002
          - night
          - week
          - month
          - year
          - hour
          - day
          - semester
          - academic_year
        locality:
          type: string
        landmark_name:
          type: string
          description: The nearest routed landmark. Absent until the listing has been
            routed.
        walk_minutes:
          type: integer
          description: Walking time to landmark_name. Absent until routed.
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        photo_count:
          type: integer
        cover_url:
          type: string
          description: The card-sized rendition when one exists, otherwise the full
            image.
        rating:
          type: number
          format: double
        review_count:
          type: integer
        distance_m:
          type: integer
    SearchPage:
      type: object
      required:
      - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/SearchResult'
        next_cursor:
          type: string
          description: Opaque. Present only when another page exists.
    PublicLocation:
      type: object
      required:
      - latitude
      - longitude
      - locality
      - region
      - country
      - approximate
      properties:
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        locality:
          type: string
        region:
          type: string
        country:
          type: string
        landmark:
          type: string
        approximate:
          type: boolean
          description: Always true. The point is snapped to a grid about 550m across
            until booking.
    PublicListing:
      type: object
      required:
      - id
      - slug
      - space_type
      - rental_mode
      - title
      - description
      - base_price_minor
      - currency
      - price_period
      - deposit_minor
      - advance_months
      - max_occupancy
      - location
      - amenities
      - attributes
      properties:
        id:
          type: string
          format: uuid
          description: The listing's id. Booking and messaging are addressed by it.
        slug:
          type: string
        space_type:
          $ref: '#/components/schemas/SearchResult/properties/space_type'
        rental_mode:
          type: string
          enum: *id001
        title:
          type: string
        description:
          type: string
        base_price_minor:
          type: integer
          format: int64
        currency:
          type: string
        price_period:
          type: string
          enum: *id002
        deposit_minor:
          type: integer
          format: int64
        advance_months:
          type: integer
        max_occupancy:
          type: integer
        location:
          $ref: '#/components/schemas/PublicLocation'
        amenities:
          type: array
          items:
            type: string
        attributes:
          type: object
          additionalProperties: true
        published_at:
          type:
          - string
          - 'null'
          format: date-time
    Media:
      type: object
      required:
      - id
      - url
      - width
      - height
      - position
      properties:
        id:
          type: string
        url:
          type: string
          description: The full image, for the listing page.
        card_url:
          type: string
          description: 'A small JPEG rendition, around 60KB. Absent for photos uploaded

            before renditions existed.

            '
        content_type:
          type: string
        width:
          type: integer
        height:
          type: integer
        byte_size:
          type: integer
        position:
          type: integer
        status:
          type: string
    Walk:
      type: object
      required:
      - name
      - kind
      - minutes
      - metres
      properties:
        name:
          type: string
        kind:
          type: string
        locality:
          type: string
        minutes:
          type: integer
        metres:
          type: integer
    Video:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - pending
          - processing
          - ready
          - failed
        video_url:
          type: string
        poster_url:
          type: string
        duration_seconds:
          type: integer
        width:
          type: integer
        height:
          type: integer
    QuoteLine:
      type: object
      required:
      - code
      - label
      - amount_minor
      properties:
        code:
          type: string
        label:
          type: string
        amount_minor:
          type: integer
          format: int64
    Quote:
      type: object
      required:
      - mode
      - currency
      - lines
      - subtotal_minor
      - discount_minor
      - fees_minor
      - total_minor
      - due_now_minor
      properties:
        mode:
          type: string
          enum: *id001
        currency:
          type: string
        check_in:
          type: string
          format: date-time
        check_out:
          type: string
          format: date-time
        nights:
          type: integer
        months:
          type: integer
        lines:
          type: array
          items:
            $ref: '#/components/schemas/QuoteLine'
        subtotal_minor:
          type: integer
          format: int64
        discount_minor:
          type: integer
          format: int64
        fees_minor:
          type: integer
          format: int64
        total_minor:
          type: integer
          format: int64
        due_now_minor:
          type: integer
          format: int64
          description: What leaves the renter's account today, including rent in advance
            and deposit.
    ReviewSummary:
      type: object
      required:
      - count
      - average
      properties:
        count:
          type: integer
        average:
          type: number
          format: double
    FieldSchema:
      type: object
      required:
      - key
      - label
      - kind
      properties:
        key:
          type: string
        label:
          type: string
        kind:
          type: string
          enum:
          - int
          - float
          - bool
          - enum
          - string
        weight:
          type: integer
        unit:
          type: string
        options:
          type: array
          items:
            type: string
    TypeSchema:
      type: object
      required:
      - type
      - label
      - fields
      properties:
        type:
          type: string
        label:
          type: string
        modes:
          type: array
          items:
            type: string
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldSchema'
        price_periods:
          type: array
          items:
            type: string
            enum: *id002
    HostLocation:
      type: object
      required:
      - latitude
      - longitude
      - locality
      properties:
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        locality:
          type: string
        region:
          type: string
        country:
          type: string
        landmark:
          type: string
        digital_address:
          type: string
    HostListing:
      type: object
      description: The host's own view. Carries the exact location; never served publicly.
      required:
      - id
      - slug
      - space_type
      - rental_mode
      - status
      - title
      - base_price_minor
      - currency
      - price_period
      - location
      - attributes
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        space_type:
          $ref: '#/components/schemas/SearchResult/properties/space_type'
        rental_mode:
          type: string
          enum: *id001
        status:
          type: string
          enum:
          - draft
          - in_review
          - published
          - suspended
          - archived
        title:
          type: string
        description:
          type: string
        base_price_minor:
          type: integer
          format: int64
        currency:
          type: string
        price_period:
          type: string
          enum: *id002
        deposit_minor:
          type: integer
          format: int64
        advance_months:
          type: integer
        max_occupancy:
          type: integer
        location:
          $ref: '#/components/schemas/HostLocation'
        amenities:
          type: array
          items:
            type: string
        attributes:
          type: object
          additionalProperties: true
        published_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        host_id:
          type: string
          format: uuid
    CreateListing:
      type: object
      additionalProperties: false
      required:
      - space_type
      - rental_mode
      - title
      - base_price_minor
      - price_period
      - max_occupancy
      - location
      properties:
        space_type:
          $ref: '#/components/schemas/SearchResult/properties/space_type'
        rental_mode:
          type: string
          enum: *id001
        title:
          type: string
          minLength: 8
          maxLength: 120
        description:
          type: string
          maxLength: 5000
        base_price_minor:
          type: integer
          format: int64
          minimum: 1
        currency:
          type: string
        price_period:
          type: string
          enum: *id002
        deposit_minor:
          type: integer
          format: int64
          minimum: 0
        advance_months:
          type: integer
          minimum: 0
          maximum: 6
        max_occupancy:
          type: integer
          minimum: 1
          maximum: 500
        location:
          type: object
          additionalProperties: false
          required:
          - latitude
          - longitude
          - locality
          properties:
            latitude:
              type: number
              format: double
            longitude:
              type: number
              format: double
            locality:
              type: string
            region:
              type: string
            country:
              type: string
            landmark:
              type: string
            digital_address:
              type: string
        amenities:
          type: array
          items:
            type: string
        attributes:
          type: object
          additionalProperties: true
    UploadTicket:
      type: object
      required:
      - media
      - upload_url
      - headers
      properties:
        media:
          $ref: '#/components/schemas/Media'
        upload_url:
          type: string
        expires_at:
          type: string
          format: date-time
        max_bytes:
          type: integer
          format: int64
        method:
          type: string
        headers:
          type: object
          additionalProperties:
            type: string
    Booking:
      type: object
      required:
      - id
      - reference
      - space_id
      - rental_mode
      - status
      - starts_on
      - ends_on
      - guests
      - currency
      - total_minor
      - due_now_minor
      - created_at
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
        space_id:
          type: string
          format: uuid
        guest:
          type: object
          description: Shown only to the host, so they know who is asking.
          required:
          - display_name
          - member_since
          - phone_verified
          properties:
            display_name:
              type: string
            member_since:
              type: string
              format: date-time
            phone_verified:
              type: boolean
        location:
          type: object
          description: 'The exact address. The host always sees it; the guest only
            once the

            booking is paid (confirmed, active or completed).

            '
          required:
          - latitude
          - longitude
          - locality
          properties:
            latitude:
              type: number
              format: double
            longitude:
              type: number
              format: double
            locality:
              type: string
            landmark:
              type: string
            digital_address:
              type: string
        space:
          type: object
          description: The listing, for display. Absent if it could not be loaded.
          required:
          - slug
          - title
          properties:
            slug:
              type: string
            title:
              type: string
        rental_mode:
          type: string
          enum: *id001
        status:
          type: string
          enum:
          - held
          - approved
          - confirmed
          - active
          - completed
          - cancelled
          - declined
          - expired
        starts_on:
          type: string
          format: date
        ends_on:
          type: string
          format: date
        nights:
          type: integer
        months:
          type: integer
        guests:
          type: integer
        currency:
          type: string
        total_minor:
          type: integer
          format: int64
        due_now_minor:
          type: integer
          format: int64
        cancellation_policy:
          type: string
        refund_minor:
          type: integer
          format: int64
        hold_expires_at:
          type: string
          format: date-time
          description: 'While held, the deadline to pay (nightly) or for the host
            to respond

            (term). While approved, the deadline to pay.

            '
        created_at:
          type: string
          format: date-time
    PaymentIntent:
      type: object
      required:
      - authorization_url
      - reference
      - amount_minor
      - currency
      properties:
        payment_id:
          type: string
        reference:
          type: string
        access_code:
          type: string
        authorization_url:
          type: string
        amount_minor:
          type: integer
          format: int64
        currency:
          type: string
        status:
          type: string
    Night:
      type: object
      required:
      - date
      - price_minor
      - available
      properties:
        date:
          type: string
          format: date-time
        price_minor:
          type: integer
          format: int64
        source:
          type: string
        available:
          type: boolean
    PayoutAccount:
      type: object
      required:
      - id
      - channel
      - bank_code
      - account_number
      - account_name
      - verified
      properties:
        id:
          type: string
        channel:
          type: string
        bank_code:
          type: string
          description: MTN, VOD (Telecel Cash) or ATL (AT Money).
        account_number:
          type: string
        account_name:
          type: string
        verified:
          type: boolean
    Balance:
      type: object
      required:
      - currency
      - total_minor
      - available_minor
      - pending_minor
      - in_flight_minor
      - withdrawable_minor
      properties:
        currency:
          type: string
        total_minor:
          type: integer
          format: int64
        available_minor:
          type: integer
          format: int64
        pending_minor:
          type: integer
          format: int64
          description: Paid by guests and held until they move in.
        in_flight_minor:
          type: integer
          format: int64
        withdrawable_minor:
          type: integer
          format: int64
    Payout:
      type: object
      required:
      - id
      - reference
      - status
      - currency
      - amount_minor
      - created_at
      properties:
        id:
          type: string
        reference:
          type: string
        status:
          type: string
        currency:
          type: string
        amount_minor:
          type: integer
          format: int64
        failure_reason:
          type: string
        settled_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
    Message:
      type: object
      required:
      - id
      - sender_id
      - body
      - redacted
      - created_at
      properties:
        id:
          type: string
        sender_id:
          type: string
        body:
          type: string
        redacted:
          type: boolean
          description: Contact details were removed because no booking is paid yet.
        created_at:
          type: string
          format: date-time
    ThreadHeader:
      type: object
      required:
      - id
      - role
      properties:
        id:
          type: string
        role:
          type: string
          enum:
          - guest
          - host
        space:
          type: object
          required:
          - slug
          - title
          properties:
            slug:
              type: string
            title:
              type: string
        with:
          type: object
          description: The other person in the conversation.
          required:
          - display_name
          properties:
            display_name:
              type: string
    ThreadSummary:
      type: object
      required:
      - id
      - space_id
      - role
      - unread
      properties:
        id:
          type: string
        space_id:
          type: string
        role:
          type: string
          enum:
          - guest
          - host
        unread:
          type: boolean
        last_message_at:
          type:
          - string
          - 'null'
          format: date-time
        last_message:
          type: string
          description: A preview of the newest message, as stored, so already redacted.
        space:
          type: object
          required:
          - slug
          - title
          properties:
            slug:
              type: string
            title:
              type: string
        with:
          type: object
          required:
          - display_name
          properties:
            display_name:
              type: string
    Notification:
      type: object
      required:
      - id
      - event
      - title
      - body
      - read
      - created_at
      properties:
        id:
          type: string
        event:
          type: string
        title:
          type: string
        body:
          type: string
        data:
          type: object
          additionalProperties: true
        read:
          type: boolean
        created_at:
          type: string
          format: date-time
    PatchListing:
      type: object
      additionalProperties: false
      description: Updates only drafts or listings in review. Editing returns the
        listing to draft; withdraw a published listing before editing. Attributes
        are a complete replacement document.
      properties:
        rental_mode:
          type: string
          enum:
          - nightly
          - term
          - flexible
        title:
          type: string
          minLength: 8
          maxLength: 120
        description:
          type: string
          maxLength: 5000
        base_price_minor:
          type: integer
          format: int64
          minimum: 1
        price_period:
          type: string
          enum:
          - night
          - week
          - month
          - year
          - hour
          - day
          - semester
          - academic_year
        deposit_minor:
          type: integer
          format: int64
          minimum: 0
        advance_months:
          type: integer
          minimum: 0
          maximum: 6
        max_occupancy:
          type: integer
          minimum: 1
          maximum: 500
        amenities:
          type: array
          items:
            type: string
        attributes:
          type: object
          additionalProperties: true
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        locality:
          type: string
        region:
          type: string
        landmark:
          type: string
        digital_address:
          type: string
    ListingReport:
      type: object
      properties:
        id: &id003
          type: string
          format: uuid
        space_id: *id003
        reason: &id004
          type: string
        details: *id004
        status: *id004
        created_at:
          type: string
          format: date-time
        title:
          type: string
        slug:
          type: string
      required:
      - id
      - space_id
      - reason
      - details
      - status
      - created_at
      - title
      - slug
    CommunicationBoundary:
      type: object
      properties:
        blocked:
          type: boolean
        messaging_allowed:
          type: boolean
      required:
      - blocked
      - messaging_allowed
  responses:
    Problem:
      description: RFC 9457 problem document
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
paths:
  /healthz:
    get:
      summary: Liveness
      description: The process is running. Says nothing about its dependencies.
      operationId: getHealth
      responses:
        '200':
          description: Alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /readyz:
    get:
      summary: Readiness
      description: The process can serve traffic, including reaching its database.
      operationId: getReadiness
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: Not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
  /v1/auth/otp:
    post:
      summary: Send a one-time code by SMS
      description: 'Never reveals whether an account exists; users are created on
        first

        successful verification. Rate limited per phone and per client IP.

        '
      operationId: requestOTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - phone
              properties:
                phone:
                  type: string
                  description: Any common Ghanaian format; normalised to E.164.
      responses:
        '202':
          description: Code sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OTPSent'
        '400':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /v1/auth/verify:
    post:
      summary: Exchange a code for a session
      operationId: verifyOTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - phone
              - code
              properties:
                phone:
                  type: string
                code:
                  type: string
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /v1/auth/refresh:
    post:
      summary: Rotate a refresh token
      description: 'Every refresh issues a new refresh token and retires the old one.

        Replaying a retired token after the grace window revokes the whole

        session family, on the assumption that it was stolen.

        '
      operationId: refreshSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Rotated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /v1/auth/logout:
    post:
      summary: Revoke a session family
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Signed out
        '400':
          $ref: '#/components/responses/Problem'
  /v1/me:
    patch:
      summary: Update the signed-in user's display name
      description: Names are shown to the other party before booking, so contact details
        are refused.
      operationId: patchMe
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - display_name
              properties:
                display_name:
                  type: string
                  minLength: 2
                  maxLength: 60
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '422':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
    get:
      summary: The signed-in user
      operationId: getMe
      security:
      - bearerAuth: []
      responses:
        '200':
          description: The user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Problem'
    delete:
      summary: Close account and remove profile data
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Success
        '401':
          description: Not signed in
        '403':
          description: Not permitted
        '404':
          description: Not found
        '409':
          description: Resolve outstanding responsibilities first
        '422':
          description: Invalid input
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                confirmation:
                  type: string
                  const: DELETE
              required:
              - confirmation
  /v1/auth/external:
    post:
      summary: Exchange a verified provider identity for a Findaspace session
      operationId: externalLogin
      description: Only the trusted web backend may call this endpoint. Provider issuer,
        audience, signature, expiry and nonce are verified by the API.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalLogin'
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /v1/me/sign-in-methods:
    get:
      summary: List connected external sign-in methods
