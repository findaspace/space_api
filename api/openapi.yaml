      - bearerAuth: []
      responses:
        '200':
          description: Connected methods
          content:
            application/json:
              schema:
                type: object
                required:
                - methods
                properties:
                  methods:
                    type: array
                    items:
                      type: string
                      enum:
                      - google
                      - microsoft
                      - apple
        '401':
          $ref: '#/components/responses/Problem'
    post:
      summary: Connect a provider to the recently authenticated account
      operationId: linkSignInMethod
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalLogin'
      responses:
        '200':
          description: Connected and session renewed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /v1/me/phone:
    post:
      summary: Verify and connect a phone to the recently authenticated account
      operationId: linkPhone
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - phone
              - code
              properties:
                phone:
                  type: string
                code:
                  type: string
