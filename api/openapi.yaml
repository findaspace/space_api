                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /v1/search:
    get:
      summary: Search published listings
      description: 'Keyset paginated. Pass next_cursor back as cursor to continue;
        a new

        filter means starting again without one.

        '
      operationId: search
      parameters:
      - name: q
        in: query
        schema:
          type: string
          maxLength: 80
      - name: type
        in: query
        description: 'One space type, or several joined by commas. Never repeated:
          the

          API reads this parameter once, so type=a&type=b keeps only a.

          '
        schema:
          type: string
      - name: mode
        in: query
        schema:
          type: string
          enum: *id001
      - name: max_price
        in: query
        description: Minor units.
        schema:
          type: integer
          format: int64
          minimum: 1
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - relevance
          - price_asc
          - price_desc
          - distance
          - newest
      - name: cursor
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 50
      - name: price_period
        in: query
        description: Filter to the same advertised rate period before comparing prices.
        schema:
          type: string
          enum: *id002
      responses:
        '200':
          description: A page of results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchPage'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /v1/listings/{slug}:
    get:
      summary: A published listing, as any visitor may see it
