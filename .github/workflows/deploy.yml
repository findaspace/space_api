name: deploy

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrate:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Migrations run once, before any new code serves traffic. Never on boot:
      # two replicas starting together would race on the same ALTER.
      - name: Apply migrations
        run: |
          docker run --rm \
            -e SPACE_DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            --entrypoint /migrate \
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}

  release:
    needs: migrate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Roll the services
        run: |
          echo "TAG=${{ github.ref_name }} docker compose -f deploy/compose.prod.yaml up -d"
